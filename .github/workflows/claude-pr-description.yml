name: Claude PR Description Generator

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-description:
    if: github.event.pull_request.body == '' || contains(github.event.pull_request.body, '<!-- auto-generate-description -->')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate PR Description
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.RITCHY_GITHUB_CLAUDE_TOKEN }}
          timeout_minutes: "30"
          direct_prompt: |
            Please analyze this pull request and generate a comprehensive description.

            The description should include:
            1. **Summary**: A clear, concise summary of what this PR accomplishes
            2. **Changes**: List of key changes made (files modified, features added/removed)
            3. **Type of Change**: 
               - 🐛 Bug fix
               - ✨ New feature
               - ♻️ Refactor
               - 📝 Documentation
               - 🚀 Performance improvement
               - 🔧 Configuration change
               - 🧪 Test addition/improvement
            4. **Testing**: How to test these changes
            5. **Breaking Changes**: Any breaking changes (if applicable)
            6. **Related Issues**: Link to any related issues or tickets

            Format the description using proper markdown with clear sections and bullet points.
            Be specific about the changes and their impact.
            If this is a follow-up to previous PRs, mention that context.
          allowed_tools: "mcp__github__update_pull_request" 