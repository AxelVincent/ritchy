name: Slash Commands
on:
  issue_comment:
    types: [created]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/slash-commands@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMANDS: |
            pulls:
              review:
                dispatch: true
                comment: |
                  🤖 **Claude PR Assistant** is analyzing your PR...

                  This will:
                  - Review code quality and best practices
                  - Generate PR description (if needed)
                  - Provide detailed feedback
                  - Show cost analysis

                  Please wait while Claude processes your changes.
                reactions: ['robot', 'eyes']