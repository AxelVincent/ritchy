name: Claude PR Assistant

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze PR & Extract Context
        id: analysis
        run: |
          # Extract Linear ticket from branch name
          BRANCH_NAME="${{ github.head_ref }}"
          TICKET_ID=$(echo "$BRANCH_NAME" | grep -o '[A-Z]\{2,4\}-[0-9]\{1,4\}' | head -1)
          
          # Determine complexity score
          FILES_CHANGED="${{ github.event.pull_request.changed_files }}"
          ADDITIONS="${{ github.event.pull_request.additions }}"
          COMPLEXITY_SCORE=$((FILES_CHANGED * 10 + ADDITIONS / 10))
          
          echo "ticket_id=$TICKET_ID" >> $GITHUB_OUTPUT
          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "complexity_score=$COMPLEXITY_SCORE" >> $GITHUB_OUTPUT

      - name: Find Previous Cost Comment
        id: find_cost
        run: |
          # Find existing cost report comment
          COST_COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.body | contains("💵 Cost Breakdown")) | .id' 2>/dev/null | head -1 || echo "")
          echo "cost_comment_id=$COST_COMMENT_ID" >> $GITHUB_OUTPUT

      - name: Find Previous Review Comment
        id: find_review
        run: |
          # Find existing automated review comment
          REVIEW_COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.body | contains("🤖 Automated Code Review")) | .id' 2>/dev/null | head -1 || echo "")
          echo "review_comment_id=$REVIEW_COMMENT_ID" >> $GITHUB_OUTPUT

      - name: Extract Previous Total Cost
        id: extract_cost
        run: |
          PREVIOUS_TOTAL_COST="0"
          
          if [ ! -z "${{ steps.find_cost.outputs.cost_comment_id }}" ]; then
            # Extract previous total cost from existing comment
            PREVIOUS_TOTAL=$(gh api repos/${{ github.repository }}/issues/comments/${{ steps.find_cost.outputs.cost_comment_id }} --jq '.body' | grep -o '\*\*Total Cost\*\*: \$[0-9]*\.[0-9]*' | grep -o '[0-9]*\.[0-9]*' | head -1 || echo "0")
            PREVIOUS_TOTAL_COST="$PREVIOUS_TOTAL"
          fi
          
          echo "previous_total_cost=$PREVIOUS_TOTAL_COST" >> $GITHUB_OUTPUT

      - name: Run Claude PR Assistant
        id: claude
        uses: anthropics/claude-code-base-action@bb2ef1d9768b9e94083d377778120f8f27958a72
        with:
          model: "claude-sonnet-4-20250514"
          direct_prompt: |
            Analyze this PR and perform two tasks:

            1. **Generate PR Description** (if missing or contains <!-- auto-generate-description -->):
               - Create comprehensive description with summary, changes, testing notes
               - Include Linear ticket context if available (TICKET_ID: ${{ steps.analysis.outputs.ticket_id }})
               - Use clear markdown formatting

            2. **Code Review**:
               - Review code quality, security, performance
               - Check for bugs, best practices, type safety
               - Provide actionable feedback
               - Use GitHub review tools to add comments

            **Context:**
            - Files: ${{ steps.analysis.outputs.files_changed }}
            - Additions: ${{ steps.analysis.outputs.additions }}
            - Linear Ticket: ${{ steps.analysis.outputs.ticket_id }}

            **Tools Available:**
            - Update PR description: mcp__github__update_pull_request
            - Create/update review: mcp__github__create_pending_pull_request_review, mcp__github__add_pull_request_review_comment_to_pending_review, mcp__github__submit_pending_pull_request_review
            - Linear integration: mcp__linear__*
            - File operations: Read, Edit, MultiEdit, Write

            **Important:** Use the exact tools provided. Do not use any other tools.
          allowed_tools: "Edit,MultiEdit,Glob,Grep,LS,Read,Write,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,mcp__github_file_ops__update_claude_comment,mcp__github__update_pull_request,mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__linear__*"
          disallowed_tools: "WebSearch,WebFetch"
          timeout_minutes: "30"
          max_iterations: "10"
          enable_all_project_mcp_servers: true
          mcp_servers: "linear"

      - name: Extract Actual Costs
        id: extract_costs
        run: |
          # Initialize variables with defaults
          ACTUAL_COST="0"
          INPUT_TOKENS="0"
          OUTPUT_TOKENS="0"
          EXECUTION_STATUS="success"
          
          # Try to extract actual costs from the execution output
          if [ -f "/home/runner/work/_temp/claude-execution-output.json" ]; then
            echo "Debug: Found execution output file"
            
            # Check if jq is available
            if command -v jq &> /dev/null; then
              echo "Debug: jq is available"
              
              # Extract total cost from the last entry in the array
              COST=$(cat "/home/runner/work/_temp/claude-execution-output.json" | jq -r '.[-1].total_cost_usd // empty' 2>/dev/null)
              if [ ! -z "$COST" ] && [ "$COST" != "null" ]; then
                ACTUAL_COST="$COST"
                echo "Debug: Extracted cost: $COST"
              fi
              
              # Extract token usage from the last entry
              USAGE=$(cat "/home/runner/work/_temp/claude-execution-output.json" | jq -r '.[-1].usage // empty' 2>/dev/null)
              if [ ! -z "$USAGE" ] && [ "$USAGE" != "null" ]; then
                INPUT_TOKENS=$(echo "$USAGE" | jq -r '.input_tokens // 0' 2>/dev/null || echo "0")
                OUTPUT_TOKENS=$(echo "$USAGE" | jq -r '.output_tokens // 0' 2>/dev/null || echo "0")
                echo "Debug: Extracted tokens - Input: $INPUT_TOKENS, Output: $OUTPUT_TOKENS"
              fi
            else
              echo "Debug: jq not available, using grep fallback"
              # Fallback to grep if jq is not available
              COST=$(grep -o '"total_cost_usd":[0-9]*\.[0-9]*' "/home/runner/work/_temp/claude-execution-output.json" | tail -1 | cut -d':' -f2 || echo "0")
              ACTUAL_COST="$COST"
            fi
          else
            echo "Debug: No execution output file found"
          fi
          
          echo "actual_cost=$ACTUAL_COST" >> $GITHUB_OUTPUT
          echo "input_tokens=$INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "output_tokens=$OUTPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "execution_status=$EXECUTION_STATUS" >> $GITHUB_OUTPUT

      - name: Post Cost Report
        run: |
          # Calculate new total cost
          PREVIOUS_TOTAL="${{ steps.extract_cost.outputs.previous_total_cost }}"
          NEW_COST="${{ steps.extract_costs.outputs.actual_cost }}"
          TOTAL_COST=$(echo "scale=4; $PREVIOUS_TOTAL + $NEW_COST" | bc -l)
          
          # Calculate estimated cost
          FILES="${{ steps.analysis.outputs.files_changed }}"
          ADDITIONS="${{ steps.analysis.outputs.additions }}"
          ESTIMATED_INPUT_TOKENS=$((FILES * 200 + ADDITIONS * 2 + 1000))
          ESTIMATED_OUTPUT_TOKENS=$((FILES * 50 + 500))
          ESTIMATED_COST=$(echo "scale=4; $ESTIMATED_INPUT_TOKENS * 3.00 / 1000000 + $ESTIMATED_OUTPUT_TOKENS * 15.00 / 1000000" | bc -l)
          
          # Calculate difference
          DIFFERENCE=$(echo "scale=4; $NEW_COST - $ESTIMATED_COST" | bc -l)
          
          # Format the cost report
          COST_REPORT="## 💰 Claude Cost Report

          **Status**: ✅ Success

          ### 📊 Usage Details
          - **Model**: claude-sonnet-4-20250514
          - **Input Tokens**: ${{ steps.extract_costs.outputs.input_tokens }}
          - **Output Tokens**: ${{ steps.extract_costs.outputs.output_tokens }}
          - **Total Tokens**: $(( ${{ steps.extract_costs.outputs.input_tokens }} + ${{ steps.extract_costs.outputs.output_tokens }} ))

          ### 💵 Cost Breakdown
          - **Previous Total Cost**: \$$PREVIOUS_TOTAL
          - **New Cost**: \$$NEW_COST
          - **Total Cost**: \$$TOTAL_COST
          - **Estimated Cost**: \$$ESTIMATED_COST
          - **Difference**: 📈 +\$$DIFFERENCE

          ### 📈 PR Metrics
          - **Files Changed**: ${{ steps.analysis.outputs.files_changed }}
          - **Lines Added**: ${{ steps.analysis.outputs.additions }}
          - **Complexity Score**: ${{ steps.analysis.outputs.complexity_score }}
          - **Linear Ticket**: ${{ steps.analysis.outputs.ticket_id }}

          ---
          *Generated by Claude PR Assistant*"
          
          # Post or update cost report
          if [ ! -z "${{ steps.find_cost.outputs.cost_comment_id }}" ]; then
            # Update existing comment
            gh api repos/${{ github.repository }}/issues/comments/${{ steps.find_cost.outputs.cost_comment_id }} --method PATCH --field body="$COST_REPORT"
            echo "Updated existing cost comment"
          else
            # Create new comment
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --field body="$COST_REPORT"
            echo "Created new cost comment"
          fi

      - name: Post Automated Review Summary
        run: |
          # Create review summary comment
          REVIEW_SUMMARY="## 🤖 Automated Code Review

          **Status**: ✅ Completed

          ### 📋 Review Summary
          - **Files Reviewed**: ${{ steps.analysis.outputs.files_changed }}
          - **Lines Analyzed**: ${{ steps.analysis.outputs.additions }}
          - **Linear Ticket**: ${{ steps.analysis.outputs.ticket_id }}
          - **Review Cost**: \$${{ steps.extract_costs.outputs.actual_cost }}

          ### 🔍 Review Details
          This automated review has been completed using Claude AI. Check the PR review tab for detailed comments and suggestions.

          ---
          *Generated by Claude PR Assistant*"
          
          # Post or update review summary
          if [ ! -z "${{ steps.find_review.outputs.review_comment_id }}" ]; then
            # Update existing comment
            gh api repos/${{ github.repository }}/issues/comments/${{ steps.find_review.outputs.review_comment_id }} --method PATCH --field body="$REVIEW_SUMMARY"
            echo "Updated existing review comment"
          else
            # Create new comment
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --field body="$REVIEW_SUMMARY"
            echo "Created new review comment"
          fi