name: Claude PR Assistant

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze PR & Extract Context
        id: analysis
        run: |
          # Extract Linear ticket from branch name
          BRANCH_NAME="${{ github.head_ref }}"
          TICKET_ID=$(echo "$BRANCH_NAME" | grep -o '[A-Z]\{2,4\}-[0-9]\{1,4\}' | head -1)
          
          # Determine if description is needed
          NEEDS_DESCRIPTION="false"
          if [[ "${{ github.event.pull_request.body }}" == "" ]] || [[ "${{ github.event.pull_request.body }}" == *"<!-- auto-generate-description -->"* ]]; then
            NEEDS_DESCRIPTION="true"
          fi
          
          # Calculate complexity score
          COMPLEXITY_SCORE=$((github.event.pull_request.changed_files + github.event.pull_request.additions / 10))
          
          # Determine if this is a critical PR
          IS_CRITICAL="false"
          if [[ "${{ github.event.pull_request.title }}" == *"security"* ]] || [[ "${{ github.event.pull_request.title }}" == *"breaking"* ]] || [[ "${{ github.event.pull_request.title }}" == *"critical"* ]]; then
            IS_CRITICAL="true"
          fi
          
          echo "ticket_id=$TICKET_ID" >> $GITHUB_OUTPUT
          echo "needs_description=$NEEDS_DESCRIPTION" >> $GITHUB_OUTPUT
          echo "complexity_score=$COMPLEXITY_SCORE" >> $GITHUB_OUTPUT
          echo "is_critical=$IS_CRITICAL" >> $GITHUB_OUTPUT

      - name: Estimate Cost
        id: cost
        run: |
          # Sonnet pricing (per 1M tokens)
          SONNET_INPUT_PRICE=3.00
          SONNET_OUTPUT_PRICE=15.00
          
          # Get PR metrics
          FILES_CHANGED=${{ github.event.pull_request.changed_files }}
          ADDITIONS=${{ github.event.pull_request.additions }}
          COMPLEXITY_SCORE=${{ steps.analysis.outputs.complexity_score }}
          IS_CRITICAL="${{ steps.analysis.outputs.is_critical }}"
          
          # Estimate token usage
          ESTIMATED_INPUT_TOKENS=$((FILES_CHANGED * 200 + ADDITIONS * 2 + 1000))
          ESTIMATED_OUTPUT_TOKENS=$((FILES_CHANGED * 50 + 500))
          
          # Determine timeout based on complexity
          if [[ "$IS_CRITICAL" == "true" ]] || [[ $COMPLEXITY_SCORE -gt 75 ]]; then
            TIMEOUT=30
          else
            TIMEOUT=20
          fi
          
          # Calculate costs
          INPUT_COST=$(echo "scale=4; $ESTIMATED_INPUT_TOKENS * $SONNET_INPUT_PRICE / 1000000" | bc -l)
          OUTPUT_COST=$(echo "scale=4; $ESTIMATED_OUTPUT_TOKENS * $SONNET_OUTPUT_PRICE / 1000000" | bc -l)
          TOTAL_COST=$(echo "scale=4; $INPUT_COST + $OUTPUT_COST" | bc -l)
          
          echo "model=claude-3-sonnet-20240229" >> $GITHUB_OUTPUT
          echo "timeout=$TIMEOUT" >> $GITHUB_OUTPUT
          echo "total_cost=$TOTAL_COST" >> $GITHUB_OUTPUT
          echo "estimated_input_tokens=$ESTIMATED_INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "estimated_output_tokens=$ESTIMATED_OUTPUT_TOKENS" >> $GITHUB_OUTPUT

      - name: Log Cost & Context
        run: |
          echo "💰 Claude PR Assistant - Cost & Context"
          echo "======================================"
          echo "PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Linear Ticket: ${{ steps.analysis.outputs.ticket_id || 'None' }}"
          echo ""
          echo "📊 Analysis:"
          echo "  Files: ${{ github.event.pull_request.changed_files }}"
          echo "  Lines: +${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }}"
          echo "  Complexity: ${{ steps.analysis.outputs.complexity_score }}"
          echo "  Critical: ${{ steps.analysis.outputs.is_critical }}"
          echo ""
          echo "🤖 Configuration:"
          echo "  Model: claude-3-sonnet-20240229"
          echo "  Timeout: ${{ steps.cost.outputs.timeout }} minutes"
          echo "  Estimated Cost: ~$${{ steps.cost.outputs.total_cost }}"
          echo ""
          echo "📝 Tasks:"
          echo "  Description: ${{ steps.analysis.outputs.needs_description && 'Generate' || 'Skip' }}"
          echo "  Review: Required"
          echo "======================================"

      - name: Alert High Cost PRs
        if: steps.cost.outputs.total_cost > 0.20
        run: |
          echo "⚠️ HIGH COST PR ALERT ⚠️"
          echo "Cost: ${{ steps.cost.outputs.total_cost }}"
          echo "Consider manual review for cost optimization"

      - name: PR Assistant
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.RITCHY_GITHUB_CLAUDE_TOKEN }}
          model: "claude-3-sonnet-20240229"
          timeout_minutes: ${{ steps.cost.outputs.timeout }}
          mcp_servers: |
            {
              "mcpServers": {
                "linear": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-linear"],
                  "env": {
                    "LINEAR_API_KEY": "${{ secrets.LINEAR_API_KEY }}"
                  }
                }
              }
            }
          direct_prompt: |
            Analyze this PR following the monorepo guidelines:

            TASK 1: Description ${{ steps.analysis.outputs.needs_description == 'true' && '(REQUIRED)' || '(SKIP)' }}
            ${{ steps.analysis.outputs.needs_description == 'true' && 'Generate PR description with:
            - Summary of changes
            - Linear ticket details (if found via MCP)
            - Change type (🐛✨♻️📝🚀🔧🧪)
            - Testing instructions
            - Breaking changes (if any)
            
            Use mcp__github__update_pull_request to update.' || 'Skip description.' }}

            TASK 2: Code Review (REQUIRED)
            Follow monorepo guidelines:
            - Functional programming approach (no classes)
            - TypeScript strict mode compliance
            - Feature-based organization
            - Shared types between frontend/backend
            - Code quality & best practices
            - Linear ticket alignment (if found)
            - Bugs, performance, security issues
            - Test coverage & documentation needs
            - Use inline comments for specific issues

            Linear Ticket: ${{ steps.analysis.outputs.ticket_id || 'Not found in branch name' }}
            Critical PR: ${{ steps.analysis.outputs.is_critical }}
            ${{ steps.analysis.outputs.needs_description == 'true' && 'MUST update description.' || 'Do NOT update description.' }}
          allowed_tools: "mcp__github__update_pull_request,mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__linear__*" 