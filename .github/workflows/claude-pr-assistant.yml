name: Claude PR Assistant

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  pr-assistant:
    runs-on: ubuntu-latest
    # Only run if PR title contains '--review' AND it's a title change or new PR
    if: |
      contains(github.event.pull_request.title, '--review') &&
      (github.event.action == 'opened' || 
       github.event.action == 'synchronize' || 
       (github.event.action == 'edited' && github.event.changes.title))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.RITCHY_GITHUB_CLAUDE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze PR & Extract Context
        id: analysis
        run: |
          # Extract Linear ticket from branch name
          BRANCH_NAME="${{ github.head_ref }}"
          TICKET_ID=$(echo "$BRANCH_NAME" | grep -o '[A-Z]\{2,4\}-[0-9]\{1,4\}' | head -1)
          
          # Determine if description is needed
          NEEDS_DESCRIPTION="false"
          if [[ "${{ github.event.pull_request.body }}" == "" ]] || [[ "${{ github.event.pull_request.body }}" == *"<!-- auto-generate-description -->"* ]]; then
            NEEDS_DESCRIPTION="true"
          fi
          
          # Calculate complexity score
          FILES_CHANGED="${{ github.event.pull_request.changed_files }}"
          ADDITIONS="${{ github.event.pull_request.additions }}"
          COMPLEXITY_SCORE=$((FILES_CHANGED * 10 + ADDITIONS / 10))
          
          # Determine if this is a critical PR
          IS_CRITICAL="false"
          if [[ "${{ github.event.pull_request.title }}" == *"security"* ]] || [[ "${{ github.event.pull_request.title }}" == *"breaking"* ]] || [[ "${{ github.event.pull_request.title }}" == *"critical"* ]]; then
            IS_CRITICAL="true"
          fi
          
          echo "ticket_id=$TICKET_ID" >> $GITHUB_OUTPUT
          echo "needs_description=$NEEDS_DESCRIPTION" >> $GITHUB_OUTPUT
          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "complexity_score=$COMPLEXITY_SCORE" >> $GITHUB_OUTPUT
          echo "is_critical=$IS_CRITICAL" >> $GITHUB_OUTPUT

      - name: Log Context
        run: |
          echo "💰 Claude PR Assistant - Context"
          echo "================================================"
          echo "PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Linear Ticket: ${{ steps.analysis.outputs.ticket_id || 'None' }}"
          echo ""
          echo "📊 Analysis:"
          echo "  Files: ${{ steps.analysis.outputs.files_changed }}"
          echo "  Lines: +${{ steps.analysis.outputs.additions }}/-${{ github.event.pull_request.deletions }}"
          echo "  Complexity: ${{ steps.analysis.outputs.complexity_score }}"
          echo "  Critical: ${{ steps.analysis.outputs.is_critical }}"
          echo ""
          echo "📝 Tasks:"
          echo "  Description: ${{ steps.analysis.outputs.needs_description == 'true' && 'Generate' || 'Skip' }}"
          echo "  Review: Required"
          echo "================================================"

      - name: Run Claude PR Assistant
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.RITCHY_GITHUB_CLAUDE_TOKEN }}
          model: "claude-sonnet-4-20250514"
          timeout_minutes: 20
          mcp_servers: |
            {
              "mcpServers": {
                "linear": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-linear"],
                  "env": {
                    "LINEAR_API_KEY": "${{ secrets.LINEAR_API_KEY }}"
                  }
                }
              }
            }
          direct_prompt: |
            Analyze this PR following the monorepo guidelines:

            TASK 1: Description ${{ steps.analysis.outputs.needs_description == 'true' && '(REQUIRED)' || '(SKIP)' }}
            ${{ steps.analysis.outputs.needs_description == 'true' && 'Generate PR description with:
            - Summary of changes
            - Linear ticket details (if found via MCP)
            - Change type (🐛✨♻️📝🚀🔧🧪)
            - Testing instructions
            - Breaking changes (if any)
            
            Use mcp__github__update_pull_request to update.' || 'Skip description.' }}

            TASK 2: Code Review (REQUIRED)
            Follow monorepo guidelines:
            - Functional programming approach (no classes)
            - TypeScript strict mode compliance
            - Feature-based organization
            - Shared types between frontend/backend
            - Code quality & best practices
            - Linear ticket alignment (if found)
            - Bugs, performance, security issues
            - Test coverage & documentation needs
            - Use inline comments for specific issues

            Linear Ticket: ${{ steps.analysis.outputs.ticket_id || 'Not found in branch name' }}
            Critical PR: ${{ steps.analysis.outputs.is_critical }}
            ${{ steps.analysis.outputs.needs_description == 'true' && 'MUST update description.' || 'Do NOT update description.' }}
          allowed_tools: "mcp__github__update_pull_request,mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__linear__*"

      - name: Extract Actual Costs
        id: actual_costs
        if: always()
        run: |
          # Initialize variables with defaults
          ACTUAL_COST="0.0000"
          INPUT_TOKENS="0"
          OUTPUT_TOKENS="0"
          EXECUTION_STATUS="${{ steps.claude.outcome }}"
          
          # Check if execution output file exists
          if [ -f "/home/runner/work/_temp/claude-execution-output.json" ]; then
            if command -v jq >/dev/null 2>&1; then
              # Extract all result objects and sum their costs
              RESULT_OBJECTS=$(cat "/home/runner/work/_temp/claude-execution-output.json" | jq '[.[] | select(.type == "result")]' 2>/dev/null)
              
              if [ ! -z "$RESULT_OBJECTS" ] && [ "$RESULT_OBJECTS" != "null" ] && [ "$RESULT_OBJECTS" != "[]" ]; then
                # Sum all costs
                TOTAL_COST=$(echo "$RESULT_OBJECTS" | jq 'map(.total_cost_usd // 0) | add' 2>/dev/null || echo "0")
                
                if [ ! -z "$TOTAL_COST" ] && [ "$TOTAL_COST" != "null" ] && [ "$TOTAL_COST" != "0" ]; then
                  ACTUAL_COST="$TOTAL_COST"
                fi
                
                # Sum all token usage
                TOTAL_INPUT_TOKENS=$(echo "$RESULT_OBJECTS" | jq 'map(.usage.input_tokens // 0) | add' 2>/dev/null || echo "0")
                TOTAL_OUTPUT_TOKENS=$(echo "$RESULT_OBJECTS" | jq 'map(.usage.output_tokens // 0) | add' 2>/dev/null || echo "0")
                
                if [ ! -z "$TOTAL_INPUT_TOKENS" ] && [ "$TOTAL_INPUT_TOKENS" != "null" ]; then
                  INPUT_TOKENS="$TOTAL_INPUT_TOKENS"
                fi
                
                if [ ! -z "$TOTAL_OUTPUT_TOKENS" ] && [ "$TOTAL_OUTPUT_TOKENS" != "null" ]; then
                  OUTPUT_TOKENS="$TOTAL_OUTPUT_TOKENS"
                fi
              fi
            fi
          fi
          
          echo "actual_cost=$ACTUAL_COST" >> $GITHUB_OUTPUT
          echo "input_tokens=$INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "output_tokens=$OUTPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "execution_status=$EXECUTION_STATUS" >> $GITHUB_OUTPUT

      - name: Post Automated Review Summary
        if: always()
        run: |
          # Create review summary comment
          REVIEW_SUMMARY="## 🤖 Automated Code Review

          **Status**: ${{ steps.actual_costs.outputs.execution_status == 'success' && '✅ Completed' || '❌ Failed' }}

          ### 📋 Review Summary
          - **Files Reviewed**: ${{ steps.analysis.outputs.files_changed }}
          - **Lines Analyzed**: ${{ steps.analysis.outputs.additions }}
          - **Linear Ticket**: ${{ steps.analysis.outputs.ticket_id }}
          - **Review Cost**: \$${{ steps.actual_costs.outputs.actual_cost }}

          ### 🔍 Review Details
          This automated review has been completed using Claude AI. Check the PR review tab for detailed comments and suggestions.

          ---
          *Generated by Claude PR Assistant*"
          
          # Create new comment
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --field body="$REVIEW_SUMMARY"
