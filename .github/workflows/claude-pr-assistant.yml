name: Claude PR Assistant

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.RITCHY_GITHUB_CLAUDE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze PR & Extract Context
        id: analysis
        run: |
          # Extract Linear ticket from branch name
          BRANCH_NAME="${{ github.head_ref }}"
          TICKET_ID=$(echo "$BRANCH_NAME" | grep -o '[A-Z]\{2,4\}-[0-9]\{1,4\}' | head -1)
          
          # Determine if description is needed
          NEEDS_DESCRIPTION="false"
          if [[ "${{ github.event.pull_request.body }}" == "" ]] || [[ "${{ github.event.pull_request.body }}" == *"<!-- auto-generate-description -->"* ]]; then
            NEEDS_DESCRIPTION="true"
          fi
          
          # Calculate complexity score
          FILES_CHANGED="${{ github.event.pull_request.changed_files }}"
          ADDITIONS="${{ github.event.pull_request.additions }}"
          COMPLEXITY_SCORE=$((FILES_CHANGED * 10 + ADDITIONS / 10))
          
          # Determine if this is a critical PR
          IS_CRITICAL="false"
          if [[ "${{ github.event.pull_request.title }}" == *"security"* ]] || [[ "${{ github.event.pull_request.title }}" == *"breaking"* ]] || [[ "${{ github.event.pull_request.title }}" == *"critical"* ]]; then
            IS_CRITICAL="true"
          fi
          
          echo "ticket_id=$TICKET_ID" >> $GITHUB_OUTPUT
          echo "needs_description=$NEEDS_DESCRIPTION" >> $GITHUB_OUTPUT
          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "complexity_score=$COMPLEXITY_SCORE" >> $GITHUB_OUTPUT
          echo "is_critical=$IS_CRITICAL" >> $GITHUB_OUTPUT

      - name: Estimate Cost
        id: cost
        run: |
          # Sonnet pricing (per 1M tokens)
          SONNET_INPUT_PRICE=3.00
          SONNET_OUTPUT_PRICE=15.00
          
          # Get PR metrics
          FILES_CHANGED="${{ steps.analysis.outputs.files_changed }}"
          ADDITIONS="${{ steps.analysis.outputs.additions }}"
          COMPLEXITY_SCORE="${{ steps.analysis.outputs.complexity_score }}"
          IS_CRITICAL="${{ steps.analysis.outputs.is_critical }}"
          
          # Estimate token usage
          ESTIMATED_INPUT_TOKENS=$((FILES_CHANGED * 200 + ADDITIONS * 2 + 1000))
          ESTIMATED_OUTPUT_TOKENS=$((FILES_CHANGED * 50 + 500))
          
          # Determine timeout based on complexity
          if [[ "$IS_CRITICAL" == "true" ]] || [[ $COMPLEXITY_SCORE -gt 75 ]]; then
            TIMEOUT=30
          else
            TIMEOUT=20
          fi
          
          # Calculate costs
          INPUT_COST=$(echo "scale=4; $ESTIMATED_INPUT_TOKENS * $SONNET_INPUT_PRICE / 1000000" | bc -l)
          OUTPUT_COST=$(echo "scale=4; $ESTIMATED_OUTPUT_TOKENS * $SONNET_OUTPUT_PRICE / 1000000" | bc -l)
          TOTAL_COST=$(echo "scale=4; $INPUT_COST + $OUTPUT_COST" | bc -l)
          
          echo "model=claude-sonnet-4-20250514" >> $GITHUB_OUTPUT
          echo "timeout=$TIMEOUT" >> $GITHUB_OUTPUT
          echo "total_cost=$TOTAL_COST" >> $GITHUB_OUTPUT
          echo "estimated_input_tokens=$ESTIMATED_INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "estimated_output_tokens=$ESTIMATED_OUTPUT_TOKENS" >> $GITHUB_OUTPUT

      - name: Log Estimated Cost & Context
        run: |
          echo "💰 Claude PR Assistant - Estimated Cost & Context"
          echo "================================================"
          echo "PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Linear Ticket: ${{ steps.analysis.outputs.ticket_id || 'None' }}"
          echo ""
          echo "📊 Analysis:"
          echo "  Files: ${{ steps.analysis.outputs.files_changed }}"
          echo "  Lines: +${{ steps.analysis.outputs.additions }}/-${{ github.event.pull_request.deletions }}"
          echo "  Complexity: ${{ steps.analysis.outputs.complexity_score }}"
          echo "  Critical: ${{ steps.analysis.outputs.is_critical }}"
          echo ""
          echo "🤖 Configuration:"
          echo "  Model: claude-sonnet-4-20250514"
          echo "  Timeout: ${{ steps.cost.outputs.timeout }} minutes"
          echo "  Estimated Cost: ~$${{ steps.cost.outputs.total_cost }}"
          echo ""
          echo "📝 Tasks:"
          echo "  Description: ${{ steps.analysis.outputs.needs_description == 'true' && 'Generate' || 'Skip' }}"
          echo "  Review: Required"
          echo "================================================"

      - name: Alert High Cost PRs
        if: steps.cost.outputs.total_cost > 0.20
        run: |
          echo "⚠️ HIGH COST PR ALERT ⚠️"
          echo "Cost: ${{ steps.cost.outputs.total_cost }}"
          echo "Consider manual review for cost optimization"

      - name: Find Previous Cost Comment
        id: find_cost
        run: |
          # Find existing cost report comment
          COST_COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.body | contains("💰 Claude PR Assistant Cost Report")) | .id' 2>/dev/null | head -1 || echo "")
          echo "cost_comment_id=$COST_COMMENT_ID" >> $GITHUB_OUTPUT

      - name: Extract Previous Total Cost
        id: extract_cost
        run: |
          PREVIOUS_TOTAL_COST="0"
          
          if [ ! -z "${{ steps.find_cost.outputs.cost_comment_id }}" ]; then
            # Extract previous total cost from existing comment
            PREVIOUS_TOTAL=$(gh api repos/${{ github.repository }}/issues/comments/${{ steps.find_cost.outputs.cost_comment_id }} --jq '.body' | grep -o '\*\*Total Cost\*\*: \$[0-9]*\.[0-9]*' | grep -o '[0-9]*\.[0-9]*' | head -1 || echo "0")
            PREVIOUS_TOTAL_COST="$PREVIOUS_TOTAL"
          fi
          
          echo "previous_total_cost=$PREVIOUS_TOTAL_COST" >> $GITHUB_OUTPUT

      - name: Run Claude PR Assistant
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.RITCHY_GITHUB_CLAUDE_TOKEN }}
          model: "claude-sonnet-4-20250514"
          timeout_minutes: ${{ steps.cost.outputs.timeout }}
          mcp_servers: |
            {
              "mcpServers": {
                "linear": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-linear"],
                  "env": {
                    "LINEAR_API_KEY": "${{ secrets.LINEAR_API_KEY }}"
                  }
                }
              }
            }
          direct_prompt: |
            Analyze this PR following the monorepo guidelines:

            TASK 1: Description ${{ steps.analysis.outputs.needs_description == 'true' && '(REQUIRED)' || '(SKIP)' }}
            ${{ steps.analysis.outputs.needs_description == 'true' && 'Generate PR description with:
            - Summary of changes
            - Linear ticket details (if found via MCP)
            - Change type (🐛✨♻️📝🚀🔧🧪)
            - Testing instructions
            - Breaking changes (if any)
            
            Use mcp__github__update_pull_request to update.' || 'Skip description.' }}

            TASK 2: Code Review (REQUIRED)
            Follow monorepo guidelines:
            - Functional programming approach (no classes)
            - TypeScript strict mode compliance
            - Feature-based organization
            - Shared types between frontend/backend
            - Code quality & best practices
            - Linear ticket alignment (if found)
            - Bugs, performance, security issues
            - Test coverage & documentation needs
            - Use inline comments for specific issues

            TASK 3: Create Review Summary Comment (REQUIRED)
            Create a comment with title "🤖 Automated Code Review" containing:
            - Status (✅ Completed / ❌ Failed)
            - Review summary (files reviewed, lines analyzed, Linear ticket)
            - Review cost (will be filled later)
            - Instructions to check PR review tab for details

            Linear Ticket: ${{ steps.analysis.outputs.ticket_id || 'Not found in branch name' }}
            Critical PR: ${{ steps.analysis.outputs.is_critical }}
            ${{ steps.analysis.outputs.needs_description == 'true' && 'MUST update description.' || 'Do NOT update description.' }}
          allowed_tools: "mcp__github__update_pull_request,mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__linear__*,mcp__github__add_issue_comment"

      - name: Extract Actual Costs
        id: actual_costs
        if: always()
        run: |
          # Initialize variables with defaults
          ACTUAL_COST="0.0000"
          INPUT_TOKENS="0"
          OUTPUT_TOKENS="0"
          EXECUTION_STATUS="${{ steps.claude.outcome }}"
          
          echo "Debug: Execution status is $EXECUTION_STATUS"
          
          # Check if execution output file exists
          if [ -f "/home/runner/work/_temp/claude-execution-output.json" ]; then
            echo "Debug: Found execution output file"
            
            if command -v jq >/dev/null 2>&1; then
              echo "Debug: jq is available"
              
              # Extract all result objects and sum their costs
              RESULT_OBJECTS=$(cat "/home/runner/work/_temp/claude-execution-output.json" | jq '[.[] | select(.type == "result")]' 2>/dev/null)
              
              if [ ! -z "$RESULT_OBJECTS" ] && [ "$RESULT_OBJECTS" != "null" ] && [ "$RESULT_OBJECTS" != "[]" ]; then
                echo "Debug: Found result objects"
                
                # Sum all costs
                TOTAL_COST=$(echo "$RESULT_OBJECTS" | jq 'map(.total_cost_usd // 0) | add' 2>/dev/null || echo "0")
                echo "Debug: Total cost from all results: $TOTAL_COST"
                
                if [ ! -z "$TOTAL_COST" ] && [ "$TOTAL_COST" != "null" ] && [ "$TOTAL_COST" != "0" ]; then
                  ACTUAL_COST="$TOTAL_COST"
                  echo "Debug: Set actual cost to $ACTUAL_COST"
                fi
                
                # Sum all token usage
                TOTAL_INPUT_TOKENS=$(echo "$RESULT_OBJECTS" | jq 'map(.usage.input_tokens // 0) | add' 2>/dev/null || echo "0")
                TOTAL_OUTPUT_TOKENS=$(echo "$RESULT_OBJECTS" | jq 'map(.usage.output_tokens // 0) | add' 2>/dev/null || echo "0")
                
                echo "Debug: Total input tokens: $TOTAL_INPUT_TOKENS"
                echo "Debug: Total output tokens: $TOTAL_OUTPUT_TOKENS"
                
                if [ ! -z "$TOTAL_INPUT_TOKENS" ] && [ "$TOTAL_INPUT_TOKENS" != "null" ]; then
                  INPUT_TOKENS="$TOTAL_INPUT_TOKENS"
                fi
                
                if [ ! -z "$TOTAL_OUTPUT_TOKENS" ] && [ "$TOTAL_OUTPUT_TOKENS" != "null" ]; then
                  OUTPUT_TOKENS="$TOTAL_OUTPUT_TOKENS"
                fi
              else
                echo "Debug: No result objects found"
              fi
            else
              echo "Debug: jq not available"
            fi
          else
            echo "Debug: Execution output file not found"
          fi
          
          echo "Debug: Final values - Cost: $ACTUAL_COST, Input: $INPUT_TOKENS, Output: $OUTPUT_TOKENS"
          
          echo "actual_cost=$ACTUAL_COST" >> $GITHUB_OUTPUT
          echo "input_tokens=$INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "output_tokens=$OUTPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "execution_status=$EXECUTION_STATUS" >> $GITHUB_OUTPUT

      - name: Clean Previous Reviews
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Cleaning previous Claude reviews...');
            
            try {
              // Get all reviews for this PR
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              
              console.log(`Found ${reviews.length} existing reviews`);
              
              // Find and dismiss previous Claude reviews
              for (const review of reviews) {
                if (review.user.type === 'Bot' && 
                    review.user.login.includes('github-actions') &&
                    review.body && 
                    review.body.includes('Claude PR Assistant')) {
                  
                  console.log(`Dismissing previous Claude review: ${review.id}`);
                  
                  await github.rest.pulls.dismissReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    review_id: review.id,
                    message: 'Superseded by new Claude review'
                  });
                }
              }
              
              console.log('Finished cleaning previous reviews');
            } catch (error) {
              console.error('Error cleaning previous reviews:', error);
              // Don't fail the workflow for this
            }

      - name: Post Cost Report to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Starting cost report comment creation...');
            
            try {
              // Get PR comments
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              
              console.log(`Found ${comments.length} existing comments`);
              
              // Check if we already posted a cost report
              const existingComment = comments.find(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('💰 Claude PR Assistant Cost Report')
              );
              
              const costReportBody = generateCostReport(existingComment);
              console.log('Generated cost report body');
              
              if (existingComment) {
                console.log('Updating existing cost report comment...');
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: costReportBody
                });
                console.log('Successfully updated cost report comment');
              } else {
                console.log('Creating new cost report comment...');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: costReportBody
                });
                console.log('Successfully created cost report comment');
              }
            } catch (error) {
              console.error('Error creating cost report comment:', error);
              throw error;
            }
            
            function generateCostReport(existingComment) {
              const executionStatus = '${{ steps.actual_costs.outputs.execution_status }}';
              const newCost = '${{ steps.actual_costs.outputs.actual_cost }}' || '0.0000';
              const inputTokens = '${{ steps.actual_costs.outputs.input_tokens }}' || '0';
              const outputTokens = '${{ steps.actual_costs.outputs.output_tokens }}' || '0';
              const estimatedCost = '${{ steps.cost.outputs.total_cost }}' || '0.0000';
              const model = '${{ steps.cost.outputs.model }}' || 'claude-sonnet-4-20250514';
              const complexity = '${{ steps.analysis.outputs.complexity_score }}' || '0';
              const filesChanged = '${{ steps.analysis.outputs.files_changed }}' || '0';
              const additions = '${{ steps.analysis.outputs.additions }}' || '0';
              const linearTicket = '${{ steps.analysis.outputs.ticket_id }}' || 'None';
              
              let statusIcon = '✅';
              let statusText = 'Success';
              if (executionStatus !== 'success') {
                statusIcon = '❌';
                statusText = 'Failed';
              }
              
              // Extract previous total cost from existing comment
              let previousTotalCost = 0;
              if (existingComment) {
                const totalCostMatch = existingComment.body.match(/Total Cost.*?\$([0-9.]+)/);
                if (totalCostMatch) {
                  previousTotalCost = parseFloat(totalCostMatch[1]) || 0;
                }
              }
              
              const newCostNum = parseFloat(newCost) || 0;
              const estimatedCostNum = parseFloat(estimatedCost) || 0;
              const totalCostNum = previousTotalCost + newCostNum;
              
              const costDifference = newCostNum - estimatedCostNum;
              const costDiffIcon = costDifference > 0 ? '📈' : costDifference < 0 ? '📉' : '📊';
              const costDiffText = costDifference > 0 ? `+$${costDifference.toFixed(4)}` : costDifference < 0 ? `-$${Math.abs(costDifference).toFixed(4)}` : '$0.0000';
              
              const inputTokensNum = parseInt(inputTokens) || 0;
              const outputTokensNum = parseInt(outputTokens) || 0;
              const totalTokens = inputTokensNum + outputTokensNum;
              
              return `## 💰 Claude PR Assistant Cost Report

                    ${statusIcon} **Status**: ${statusText}

                    ### 📊 Usage Details
                    - **Model**: ${model}
                    - **Input Tokens**: ${inputTokensNum.toLocaleString()}
                    - **Output Tokens**: ${outputTokensNum.toLocaleString()}
                    - **Total Tokens**: ${totalTokens.toLocaleString()}

                    ### 💵 Cost Breakdown
                    - **Previous Total Cost**: $${previousTotalCost.toFixed(4)}
                    - **New Cost**: $${newCostNum.toFixed(4)}
                    - **Total Cost**: $${totalCostNum.toFixed(4)}
                    - **Estimated Cost**: $${estimatedCostNum.toFixed(4)}
                    - **Difference**: ${costDiffIcon} ${costDiffText}

                    ### 📈 PR Metrics
                    - **Files Changed**: ${filesChanged}
                    - **Lines Added**: ${additions}
                    - **Complexity Score**: ${complexity}
                    - **Linear Ticket**: ${linearTicket}

                    ---
                    *Generated by Claude PR Assistant*`;
            }