[package]
name = "ritchy-html-service"
version = "0.1.0"
edition = "2021"
description = "High-performance HTML processing service for Ritchy"
authors = ["Ritchy Engineering"]

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTML processing
lol_html = "3"

# Text processing
regex = "1"
once_cell = "1"

# URL handling
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-loki = "0.2"

# Error handling
thiserror = "2"

# Environment
dotenvy = "0.15"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
