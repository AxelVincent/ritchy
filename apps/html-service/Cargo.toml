[package]
name = "ritchy-html-service"
version = "0.1.0"
edition = "2021"
description = "High-performance HTML processing service for Ritchy"
authors = ["Ritchy Engineering"]

[dependencies]
# Web framework
axum = "=0.7.9"
tokio = { version = "=1.48.0", features = ["full"] }
tower-http = { version = "=0.5.2", features = ["trace", "cors", "limit"] }

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"

# HTML processing
lol_html = "=1.2.1"

# Text processing
regex = "=1.12.2"
once_cell = "=1.21.3"

# URL handling
url = "=2.5.7"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter", "json"] }
tracing-loki = "=0.2.6"

# Error handling
thiserror = "=1.0.69"

# Environment
dotenvy = "=0.15.7"

[dev-dependencies]
reqwest = { version = "=0.12.28", features = ["json"] }
tokio-test = "=0.4.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
